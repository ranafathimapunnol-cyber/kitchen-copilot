name: Kitchen Copilot CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: PostgreSQL, backend and AI tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kitchen_copilot_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kitchen_copilot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kitchen_copilot_ci
      SECRET_KEY: ci-only-test-secret-not-for-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r services/api/requirements.txt

      - name: Verify PostgreSQL and pgvector
        run: |
          python -c "import psycopg; conn=psycopg.connect('host=localhost port=5432 dbname=kitchen_copilot_ci user=postgres password=postgres'); conn.execute('CREATE EXTENSION IF NOT EXISTS vector'); conn.commit(); print('PostgreSQL and pgvector are ready')"

      - name: Run database migrations
        working-directory: services/api
        run: alembic upgrade head

      - name: Verify migration revision
        working-directory: services/api
        run: alembic current

      - name: Run backend unit tests
        working-directory: services/api
        run: python -m pytest -q tests

      - name: Run AI spike tests
        run: python -m pytest -q spikes/ai/test_spikes.py
        env:
          PYTHONPATH: services/api

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
